# 项目商店(hub)服务:独立进程、独立库,供全部客户实例调用
server.port=${HUB_PORT:8081}

spring.datasource.url=${HUB_DB_URL:jdbc:mysql://localhost:3306/ioedu_hub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${HUB_DB_USERNAME:root}
spring.datasource.password=${HUB_DB_PASSWORD:123456789}
spring.datasource.hikari.maximum-pool-size=${HUB_DB_POOL_SIZE:10}
spring.datasource.hikari.max-lifetime=1500000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-swallow-size=32MB

# 平台管理员登录令牌密钥(>=32 字符,必填);首个管理员账号(密码留空则随机生成并打印一次)
hub.jwt-secret=${HUB_JWT_SECRET:}
hub.jwt-expire-hours=24
hub.admin-username=${HUB_ADMIN_USERNAME:platform}
hub.admin-password=${HUB_ADMIN_PASSWORD:}
# 条目附带的图片/附件存放目录(内容寻址,按 sha256 去重)
hub.asset-dir=${HUB_ASSET_DIR:hub-assets}
# 客户站点后端(多租户主系统)地址与平台令牌:商店后台「客户站点」页据此一键开通站点并自动写入商店 Key
hub.platform-api-url=${HUB_PLATFORM_API_URL:}
hub.platform-token=${HUB_PLATFORM_TOKEN:}
# 站点访问地址模板({code} 替换为站点编码),仅用于在后台展示
hub.site-url-template=${HUB_SITE_URL_TEMPLATE:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

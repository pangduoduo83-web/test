# 应用服务 WEB 访问端口
server.port=8080

# MySQL 数据源(密码可用环境变量 IOEDU_DB_PASSWORD 覆盖)
spring.datasource.url=jdbc:mysql://localhost:3306/ioedu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${IOEDU_DB_PASSWORD:123456789}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Jackson
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# JWT
ioedu.jwt.secret=ioedu-new-secret-key-2026-device-library
ioedu.jwt.expire-hours=72

# 图片上传(本地磁盘,目录相对于工作目录,可用环境变量覆盖)
ioedu.upload-dir=${IOEDU_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-swallow-size=32MB
server.tomcat.max-http-form-post-size=32MB

# 微信小程序(用于 UGC 内容安全检测 msgSecCheck;留空时自动跳过检测)
ioedu.wechat.appid=${IOEDU_WECHAT_APPID:wxb9c008bb6533f541}
ioedu.wechat.secret=${IOEDU_WECHAT_SECRET:1b7e6c35bb4616a38f5a20f4cf01b084}

# AI 大模型(OpenAI 兼容协议;api-key 为空时相关功能自动降级为规则结果)
# DeepSeek: https://api.deepseek.com  模型 deepseek-chat
# 通义千问: https://dashscope.aliyuncs.com/compatible-mode  模型 qwen-plus
ioedu.ai.base-url=${IOEDU_AI_BASE_URL:https://api.deepseek.com}
ioedu.ai.api-key=${IOEDU_AI_API_KEY:}
ioedu.ai.model=${IOEDU_AI_MODEL:deepseek-chat}
ioedu.ai.connect-timeout-ms=3000
ioedu.ai.read-timeout-ms=20000

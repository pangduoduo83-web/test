# 应用服务 WEB 访问端口
server.port=8080

# ---------- 数据源 ----------
# 生产默认值均为安全取向:密钥必须注入、不种演示数据。本地开发请激活 dev profile(见 application-dev.properties)。
spring.datasource.url=${IOEDU_DB_URL:jdbc:mysql://localhost:3306/ioedu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${IOEDU_DB_USERNAME:root}
spring.datasource.password=${IOEDU_DB_PASSWORD:123456789}
# 连接池:单后端服务 100 个客户时也只用这一个池,max-lifetime 需低于 MySQL wait_timeout(默认 8 小时)
spring.datasource.hikari.maximum-pool-size=${IOEDU_DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000

# ---------- JPA / Flyway ----------
# 多租户(每客户一个库)模式下 Hibernate 不再建表/校验,表结构由 TenantSchemaMigrator 对每个库执行 Flyway:
#   平台库 → db/platform,租户库 → db/migration(老库首次接入自动标记为基线 V1)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.flyway.enabled=false

# ---------- 多租户 ----------
# 平台库(租户注册表)与默认租户:老部署的 ioedu 库自动成为默认租户,数据零迁移
ioedu.tenant.platform-db=${IOEDU_PLATFORM_DB:ioedu_platform}
ioedu.tenant.default-code=${IOEDU_DEFAULT_TENANT:default}
ioedu.tenant.default-db=${IOEDU_DEFAULT_TENANT_DB:ioedu}
# 子域名路由根域,如 labcloud.com.cn:c001.labcloud.com.cn → 租户 c001;根域/www → 默认租户。留空则所有 Host 都落默认租户
ioedu.tenant.base-domain=${IOEDU_TENANT_BASE_DOMAIN:}
# true 时无法匹配租户的 Host 返回 404;false 时落到默认租户(单租户部署、IP 直连时用)
ioedu.tenant.strict-host=${IOEDU_TENANT_STRICT_HOST:false}
# 允许用 X-Tenant-Id 请求头指定租户,仅本地联调开启(dev profile 为 true)
ioedu.tenant.allow-header-override=${IOEDU_TENANT_ALLOW_HEADER:false}
# 平台管理接口 /api/platform/**(开通租户等)的静态令牌,不少于 16 位;留空则关闭平台接口
ioedu.platform.token=${IOEDU_PLATFORM_TOKEN:}

# ---------- 项目商店(hub) ----------
# 商店服务地址(所有客户共用),各客户的 API Key 由客户管理员在「项目商店 → 接入设置」填写
ioedu.hub.base-url=${IOEDU_HUB_BASE_URL:}
# KiCad AI 设计助手(独立 Python 服务)内网地址与内部令牌(与 PLATFORM_TOKEN 相同);留空表示未接入
ioedu.kicad-ai.url=${IOEDU_KICAD_AI_URL:}
ioedu.kicad-ai.internal-token=${IOEDU_KICAD_AI_TOKEN:${IOEDU_PLATFORM_TOKEN:}}
# 库内密钥类配置(商店 API Key、大模型 API Key)的加密主密钥;留空则无法保存新密钥(仍可读取历史明文)
ioedu.master-key=${IOEDU_MASTER_KEY:}

# Jackson
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ---------- JWT ----------
# 必须通过环境变量注入且不少于 32 个字符;为空时应用拒绝启动(避免多套部署共用同一把密钥)
ioedu.jwt.secret=${IOEDU_JWT_SECRET:}
ioedu.jwt.expire-hours=72

# ---------- 初始数据 ----------
# 首次启动(用户表为空)时创建的管理员;密码留空则随机生成并以 WARN 打印到日志一次
ioedu.seed.admin-email=${IOEDU_ADMIN_EMAIL:admin@ioedu.cn}
ioedu.seed.admin-password=${IOEDU_ADMIN_PASSWORD:}
# 是否写入演示数据(演示师生账号、10 个项目、12 台设备);生产默认关闭
ioedu.seed.demo=${IOEDU_SEED_DEMO:false}

# ---------- 图片上传(本地磁盘,目录相对于工作目录,可用环境变量覆盖) ----------
ioedu.upload-dir=${IOEDU_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-swallow-size=32MB
server.tomcat.max-http-form-post-size=32MB

# ---------- 微信小程序(用于 UGC 内容安全检测 msgSecCheck;留空时自动跳过检测) ----------
ioedu.wechat.appid=${IOEDU_WECHAT_APPID:}
ioedu.wechat.secret=${IOEDU_WECHAT_SECRET:}

# ---------- AI 大模型(OpenAI 兼容协议;api-key 为空时相关功能自动降级为规则结果) ----------
# DeepSeek: https://api.deepseek.com  模型 deepseek-chat
# 通义千问: https://dashscope.aliyuncs.com/compatible-mode  模型 qwen-plus
ioedu.ai.base-url=${IOEDU_AI_BASE_URL:https://api.deepseek.com}
ioedu.ai.api-key=${IOEDU_AI_API_KEY:}
ioedu.ai.model=${IOEDU_AI_MODEL:deepseek-chat}
ioedu.ai.connect-timeout-ms=3000
ioedu.ai.read-timeout-ms=20000
# AI 助手每人每日运行次数上限(0 为不限)
ioedu.ai.daily-runs-per-user=${IOEDU_AI_DAILY_RUNS:50}
# SSE 流式响应允许的最长时间
spring.mvc.async.request-timeout=600000

# ---------- 健康检查(仅暴露 /actuator/health,不含细节) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

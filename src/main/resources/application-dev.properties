# 本地开发 profile:start-backend.bat 默认激活,IDEA 里运行请在 Run Configuration 加 --spring.profiles.active=dev
# 这里的值只用于本机联调,禁止照搬到生产。生产环境用 .env 注入真实值(见 .env.example)。

# 开发用 JWT 密钥(>=32 字符即可通过启动校验)
ioedu.jwt.secret=${IOEDU_JWT_SECRET:dev-only-ioedu-jwt-secret-please-change-in-prod}

# 演示数据与演示账号,保证 smoke-test.ps1 可直接跑通
ioedu.seed.demo=${IOEDU_SEED_DEMO:true}
ioedu.seed.admin-email=${IOEDU_ADMIN_EMAIL:admin@ioedu.cn}
ioedu.seed.admin-password=${IOEDU_ADMIN_PASSWORD:admin123}

# 本地多租户联调:允许 X-Tenant-Id 请求头切换租户;平台接口令牌固定为开发值
ioedu.tenant.allow-header-override=true
ioedu.platform.token=${IOEDU_PLATFORM_TOKEN:dev-platform-token-change-me}

# 本地项目商店(hub 以 dev profile 跑在 8081)与开发用加密主密钥
ioedu.hub.base-url=${IOEDU_HUB_BASE_URL:http://localhost:8081}
ioedu.master-key=${IOEDU_MASTER_KEY:dev-only-master-key-change-me}

# 一键部署:MySQL + Spring Boot 后端 + Nginx 前端
# 用法:docker compose up -d --build
# 数据库密码可通过 .env 文件里的 DB_PASSWORD 覆盖,默认 123456789
services:
  mysql:
    image: mysql:8.0
    container_name: ioedu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456789}
      MYSQL_DATABASE: ioedu
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ioedu-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build: .
    container_name: ioedu-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ioedu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456789}
      TZ: Asia/Shanghai
    volumes:
      # 上传图片持久化,容器重建不丢失
      - ioedu-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ioedu-frontend
    ports:
      - "8093:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ioedu-mysql-data:
  ioedu-uploads:

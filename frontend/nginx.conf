# 前端站点:静态资源 + /api 反向代理到后端容器
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # AI 流式对话(SSE):关闭缓冲、放宽读超时,否则模型输出会被攒到结束才一次性下发
    location /api/ai/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API 反向代理(backend 为 docker-compose 服务名)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传文件由后端按租户目录提供(Host 决定租户)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 项目商店平台管理端直连 hub(/platform/** 页面使用);客户站点的商店功能走 /api/store 由后端代理
    location /hub-api/ {
        proxy_pass http://hub:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
    }
    location /hub-assets/ {
        proxy_pass http://hub:8081;
        expires 30d;
    }

    # SPA 前端路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

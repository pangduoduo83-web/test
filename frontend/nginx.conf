# 前端站点:静态资源 + /api 反向代理到后端容器
# WebSocket 升级头:有 Upgrade 时透传 upgrade,否则按普通 HTTP/1.1 长连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    # 301 用相对地址,避免带非 80 端口访问时跳转丢端口
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # AI 流式对话(SSE):关闭缓冲、放宽读超时,否则模型输出会被攒到结束才一次性下发
    location /api/ai/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API 反向代理(backend 为 docker-compose 服务名)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传文件由后端按租户目录提供(Host 决定租户)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 项目商店平台管理端直连 hub(/platform/** 页面使用);客户站点的商店功能走 /api/store 由后端代理
    location /hub-api/ {
        proxy_pass http://hub:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
    }
    location /hub-assets/ {
        proxy_pass http://hub:8081;
        expires 30d;
    }

    # 硬件设计助手(KiCad 内核)(独立 Python 服务):剥掉 /kicad 前缀转发;SSE 流式 + WebSocket 在线状态 + 大工程 ZIP 上传。
    # 上游用变量 + Docker 内置 DNS 延迟解析:该服务没起来时只有 /kicad/ 返回 502,不会拖垮整站 nginx
    location /hw/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kicad_upstream kicad-ai;
        rewrite ^/hw/(.*)$ /$1 break;
        proxy_pass http://$kicad_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 200m;
    }
    location = /hw {
        return 301 /hw/;
    }
    # 旧路径兼容
    location /kicad/ {
        rewrite ^/kicad/(.*)$ /hw/$1 permanent;
    }

    # SPA 前端路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

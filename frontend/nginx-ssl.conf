# HTTPS 站点(供微信小程序等使用):证书由宿主机 /etc/letsencrypt 只读挂载提供
# 仅在服务器上通过 docker-compose.https.yml 覆盖启用,本地开发不加载本文件
server {
    listen 443 ssl;
    server_name www.labcloud.com.cn;

    ssl_certificate /etc/letsencrypt/live/www.labcloud.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.labcloud.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反向代理(backend 为 docker-compose 服务名)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传图片由后端静态资源服务
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # SPA 前端路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

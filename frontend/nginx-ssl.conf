# HTTPS 站点(供微信小程序等使用):证书由宿主机 /etc/letsencrypt 只读挂载提供
# 仅在服务器上通过 docker-compose.https.yml 覆盖启用,本地开发不加载本文件
server {
    listen 443 ssl;
    server_name www.labcloud.com.cn;
    # 301 用相对地址,避免带非 80 端口访问时跳转丢端口
    absolute_redirect off;

    ssl_certificate /etc/letsencrypt/live/www.labcloud.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.labcloud.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # AI 流式对话(SSE):关闭缓冲、放宽读超时
    location /api/ai/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API 反向代理(backend 为 docker-compose 服务名)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传文件由后端按租户目录提供(Host 决定租户)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 项目商店平台管理端直连 hub
    location /hub-api/ {
        proxy_pass http://hub:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
    }
    location /hub-assets/ {
        proxy_pass http://hub:8081;
        expires 30d;
    }

    # 硬件设计助手(KiCad 内核)(独立 Python 服务),同 nginx.conf
    location /hw/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kicad_upstream kicad-ai;
        rewrite ^/hw/(.*)$ /$1 break;
        proxy_pass http://$kicad_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 200m;
    }
    location = /hw {
        return 301 /hw/;
    }
    # 旧路径兼容
    location /kicad/ {
        rewrite ^/kicad/(.*)$ /hw/$1 permanent;
    }

    # SPA 前端路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
